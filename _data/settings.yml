# Hero Settings
hero:
  hero__title: Arnav Kharbanda
  hero__description: Hi! I am a master's student at Robotics Institute, Carnegie Mellon University. I completed my bachelors at Indian Institute of Technology, Ropar, Computer Science Department. 
  hero__description_points:
    - Passionate about removing uncertainity from Robots
    - Love tinkering with robots and experimenting with crazy ideas. Check my projects out above
    - Absolutely love teaching and disseminating knowledge in intuitive ways - my projects always have a visual component to it :)
    
  hero__image: '/images/ski.jpeg'


