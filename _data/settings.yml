# About me page.
about:
  main_content: Some things about me
  main_content_desc:
    - I can do 11km in 54 minutes—catch me if you can!
    - A sucker for biographies, I’m always diving into someone’s life story
    - Flying FPV drones is my idea of adrenaline-packed fun
    - Competitive Soccer player - find a ball, and I’ll find the goal!
    - I can bring tunes to life on the keyboard.
    - I love aerial photography - Capturing breathtaking moments from the skies is my passion.
  




